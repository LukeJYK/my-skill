name: Skill health

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"   # every Monday 14:00 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # optional: the checker falls back to a built-in parser without it
      - run: pip install pyyaml

      - name: Check skills
        run: python3 check-skills.py --quiet
